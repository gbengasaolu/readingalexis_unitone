<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gist Quest Reading Adventure</title>
<style>
:root{--ink:#17324d;--navy:#183b56;--teal:#087f8c;--gold:#f4b942;--coral:#e76f51;--sky:#eaf8fb;--paper:#fffdf8;--ok:#16794a;--bad:#a63a2b;--shadow:0 12px 32px #17324d18;font-size:17px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eefbff,#fff8e9);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:8px;z-index:9;background:#fff;padding:8px}.top{position:sticky;top:0;z-index:5;background:#183b56;color:#fff;padding:10px 4vw;display:flex;align-items:center;gap:14px;box-shadow:0 4px 18px #0002}.brand{font-weight:900;font-size:1.15rem}.trail{flex:1;height:10px;background:#ffffff30;border-radius:9px;overflow:hidden}.trail i{display:block;height:100%;background:var(--gold);width:0}.pill{background:#ffffff18;border:1px solid #ffffff40;border-radius:20px;padding:5px 10px}.iconbtn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:10px;padding:7px 10px}.shell{display:grid;grid-template-columns:260px minmax(0,900px);gap:24px;max-width:1240px;margin:24px auto;padding:0 20px}.side{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);height:max-content;position:sticky;top:80px}.side button{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--ink);margin:2px 0}.side button:hover,.side button:focus-visible,.side button.active{background:var(--sky);outline:3px solid transparent}.side .parent{margin-top:14px;border-top:1px solid #dde6ec;padding-top:14px;color:#566}.main{min-width:0}.hero,.card{background:var(--paper);border:1px solid #e5e0d6;border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,4vw,34px);margin-bottom:20px}.hero{background:linear-gradient(145deg,#0c7884,#173b57);color:#fff;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;font-size:180px;opacity:.08;right:15px;top:-55px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:800;color:var(--gold)}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;margin:.3em 0}h2{line-height:1.2}h3{margin:.3em 0}.btn{border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;padding:11px 16px;box-shadow:0 3px 0 #075b64}.btn:hover{filter:brightness(1.08)}.btn.alt{background:#fff;color:var(--navy);box-shadow:none;border:2px solid #b9ccd5}.btn.gold{background:var(--gold);color:#26384b;box-shadow:0 3px 0 #b9811c}.btn.danger{background:#b33b2e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.mode{border:2px solid #dce8ec;background:#fff;border-radius:16px;padding:17px;text-align:left;min-height:140px}.mode:hover,.mode:focus-visible{border-color:var(--teal);transform:translateY(-2px)}.tag{display:inline-block;background:#e7f6f8;border-radius:999px;padding:3px 9px;font-size:.82rem;font-weight:700}.passage{background:#fff;border-left:7px solid var(--gold);padding:20px;border-radius:12px;white-space:pre-line;line-height:1.85}.choices{display:grid;gap:10px;margin:18px 0}.choice{border:2px solid #cddce3;background:#fff;border-radius:14px;padding:13px;text-align:left}.choice:hover,.choice:focus-visible{border-color:var(--teal)}.choice.selected{background:#e7f6f8;border-color:var(--teal)}.feedback{border-radius:12px;padding:14px;margin:14px 0;background:#eef6ff;border-left:5px solid #2b6f9d}.feedback.ok{background:#eaf8f0;border-color:var(--ok)}.feedback.warn{background:#fff1ea;border-color:var(--bad)}textarea,input[type=text]{width:100%;border:2px solid #bdd0d8;border-radius:12px;padding:12px;background:#fff}textarea:focus,input:focus,button:focus-visible,select:focus{outline:3px solid #f4b942;outline-offset:2px}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;background:#f7fbfc;padding:13px;border-radius:13px;margin:12px 0}.checks label{display:flex;gap:8px}.meter{height:12px;background:#dbe8eb;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold),var(--teal))}.skillrow{display:grid;grid-template-columns:130px 1fr 42px;gap:10px;align-items:center;margin:8px 0}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.token{border:2px solid #bad0d8;background:#fff;border-radius:10px;padding:8px}.token.used{opacity:.4}.sortgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.bin{border:2px dashed #91b4bd;background:#f5fcfd;border-radius:12px;padding:10px;min-height:110px}.order{list-style:none;padding:0}.order li{background:#fff;border:2px solid #ccdce2;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:8px}.small{font-size:.86rem;color:#587080}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.rubric{border-collapse:collapse;width:100%}.rubric th,.rubric td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.badge{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--gold);font-size:1.5rem}.focus .passage p{display:none}.focus .passage p.show{display:block}.toast{position:fixed;right:18px;bottom:18px;background:#173b57;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:10}.confetti{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,#f4b942 0 4px,transparent 5px),radial-gradient(circle at 70% 20%,#e76f51 0 4px,transparent 5px),radial-gradient(circle at 50% 60%,#087f8c 0 4px,transparent 5px);animation:pop .8s both}@keyframes pop{from{opacity:0;transform:scale(.8)}50%{opacity:1}to{opacity:0;transform:scale(1.1)}}dialog{border:0;border-radius:18px;max-width:520px;box-shadow:var(--shadow)}dialog::backdrop{background:#102a3caa}@media(max-width:780px){.shell{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side h2,.side .parent{display:none}.side button{min-width:max-content}.top{flex-wrap:wrap}.trail{order:3;flex-basis:100%}.skillrow{grid-template-columns:100px 1fr 35px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{.top,.side,.actions,.no-print{display:none!important}.shell{display:block;margin:0}.card,.hero{box-shadow:none;border:0}.print-only{display:block!important}body{background:#fff}.mapblank{page-break-before:always}}
</style></head><body><a class="skip" href="#content">Skip to activity</a><header class="top"><div class="brand">🧭 Gist Quest</div><div class="trail" aria-label="Daily progress"><i id="trail"></i></div><span class="pill" id="stars">★ 0</span><button class="iconbtn" id="fontBtn" aria-label="Increase text size">A+</button><button class="iconbtn" id="soundBtn" aria-label="Mute sounds">Sound on</button></header><div class="shell"><nav class="side" aria-label="Game modes"><h2>Quest map</h2><button data-view="home" class="active">🏕️ Base Camp</button><button data-view="learn">📘 Learn & Model</button><button data-view="gist">🔎 Gist Detective</button><button data-view="sort">🧩 Element Sort</button><button data-view="evidence">🔦 Evidence Hunter</button><button data-view="sequence">🛤️ Build Recount</button><button data-view="sentence">✍️ Sentence Lab</button><button data-view="answer">💬 Type Your Answer</button><button data-view="best">🏆 Best Answer</button><button data-view="map">🗺️ Full Story Map</button><button data-view="mastery">🚀 Mastery Quest</button><button data-view="parent" class="parent">🔒 Grown-up View</button></nav><main id="content" class="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
const passages=[
{t:"The Missing Seedlings",a:"Gist Quest Studio",lv:1,text:"On Saturday morning, Maya carried twelve tomato seedlings to the community garden. She wanted to plant them before the sun grew hot. When she reached her plot, three seedlings were missing from the tray. Maya noticed a trail of damp soil leading toward the tool shed. Behind a watering can, she found the seedlings where a playful puppy had nudged them. Her neighbor held the puppy while Maya planted every seedling. Maya learned that careful observation can solve a puzzling problem.",el:{somebody:"Maya",setting:"the community garden on Saturday morning",wanted:"plant twelve tomato seedlings before it became hot",challenge:"three seedlings were missing",solution:"followed the soil trail, found the seedlings, and planted them",lesson:"Careful observation helps solve problems"},gist:"Maya uses careful observation to find her missing seedlings and finish planting them.",evidence:"Maya noticed a trail of damp soil leading toward the tool shed."},
{t:"A Banner for Room Nine",a:"Gist Quest Studio",lv:1,text:"Jordan's class needed a welcome banner for family night. Jordan volunteered to paint the letters because he enjoyed art. Halfway through, blue paint spilled across the paper. Jordan felt disappointed, but Priya suggested turning the spill into a night sky. The class added silver stars around the letters. Their changed design looked even better than the first plan. Jordan discovered that a mistake can become a new idea when people work together.",el:{somebody:"Jordan and his classmates",setting:"Room Nine before family night",wanted:"make a welcome banner",challenge:"blue paint spilled across the paper",solution:"turned the spill into a night sky with silver stars",lesson:"Teamwork can turn a mistake into a creative idea"},gist:"Jordan and his classmates work together to turn a paint spill into a creative banner.",evidence:"Priya suggested turning the spill into a night sky."},
{t:"The Quiet Goal",a:"Gist Quest Studio",lv:1,text:"Lina wanted to score a goal at soccer practice, but the field was crowded and she could not find space. Instead of rushing, she watched how her teammates moved. She called for the ball, passed it to Aiden, and ran toward an open corner. Aiden passed it back, and Lina kicked it into the net. Her coach praised the entire play, not only the goal. Lina understood that patience and teamwork create good opportunities.",el:{somebody:"Lina",setting:"soccer practice",wanted:"score a goal",challenge:"the field was crowded and she could not find space",solution:"passed, moved to an open corner, and scored",lesson:"Patience and teamwork create opportunities"},gist:"Lina uses patience and teamwork to find open space and score a goal.",evidence:"She called for the ball, passed it to Aiden, and ran toward an open corner."},
{t:"Grandpa's Recipe Card",a:"Gist Quest Studio",lv:2,text:"Eli promised to prepare Grandpa's vegetable soup for dinner. The old recipe card was smudged, and Eli could not read how much broth to add. He did not want to guess and spoil the meal. Eli compared the card with notes in Grandpa's cooking notebook. A page about soup explained the correct amount. Eli measured carefully, and the soup tasted just as he remembered. He learned that reliable information is better than a hurried guess.",el:{somebody:"Eli",setting:"home while preparing dinner",wanted:"make Grandpa's vegetable soup",challenge:"the recipe card was smudged",solution:"checked Grandpa's notebook and measured carefully",lesson:"Use reliable information instead of guessing"},gist:"Eli checks another reliable source to complete a smudged recipe and make the soup correctly.",evidence:"Eli compared the card with notes in Grandpa's cooking notebook."},
{t:"The Library Cart",a:"Gist Quest Studio",lv:2,text:"Amara helped return books to shelves after school. She hoped to finish before her ride arrived, but one cart had books from many sections. At first she moved quickly and placed two books on the wrong shelves. Then Amara paused and sorted the books by their call-number labels. The librarian checked her groups, and together they returned every book correctly. Although sorting took a few minutes, it prevented more mistakes. Amara learned that an organized plan can save time.",el:{somebody:"Amara",setting:"the school library after school",wanted:"shelve the books before her ride arrived",challenge:"the cart held books from many sections",solution:"sorted books by call-number labels before shelving",lesson:"An organized plan can save time and prevent mistakes"},gist:"Amara organizes a mixed cart of books so she can shelve them accurately.",evidence:"Amara paused and sorted the books by their call-number labels."},
{t:"Rain on Field Day",a:"Gist Quest Studio",lv:2,text:"Mateo's class had practiced relay races for field day. Just before the first race, heavy rain covered the track. Everyone expected the event to be canceled. Mateo noticed the dry gym and proposed indoor team challenges. Teachers arranged beanbag relays and balance stations. The activities were different from the original plan, but every class participated. Mateo's flexible idea kept the community celebration going.",el:{somebody:"Mateo",setting:"school field day during heavy rain",wanted:"participate in field day",challenge:"rain covered the track",solution:"suggested indoor team challenges in the gym",lesson:"Flexibility helps a group adapt to change"},gist:"Mateo suggests indoor challenges so field day can continue despite the rain.",evidence:"Mateo noticed the dry gym and proposed indoor team challenges."},
{t:"A Nest Near the Path",a:"Gist Quest Studio",lv:2,text:"Nia and her brother were clearing litter from a nature path when they spotted a bird's nest low in a bush. The shortest route to the next area passed close to it. Nia worried that the volunteers might disturb the birds. She placed two bright cones several feet away and told the team leader. The volunteers used a longer route and finished cleaning without approaching the nest. Nia realized that helping a community includes protecting its smallest neighbors.",el:{somebody:"Nia",setting:"a nature path during a cleanup",wanted:"clean litter without harming wildlife",challenge:"the route passed close to a bird's nest",solution:"marked a safer longer route and told the leader",lesson:"Community service includes protecting wildlife"},gist:"Nia protects a bird's nest by guiding cleanup volunteers along a safer route.",evidence:"She placed two bright cones several feet away and told the team leader."},
{t:"The Unfinished Drum",a:"Gist Quest Studio",lv:3,text:"For the school culture fair, Kwame was building a small hand drum with his aunt. The frame was ready, but the covering would not stay tight. Each time he pulled one side, another side loosened. Kwame wanted to quit and display an unfinished project. His aunt asked him to study the pattern of cords on an older drum. Kwame noticed that opposite cords were tightened in pairs. He copied the pattern slowly, and the covering became firm. At the fair, he explained both the drum and the strategy that helped him finish it.",el:{somebody:"Kwame",setting:"home before the school culture fair",wanted:"finish a small hand drum",challenge:"the drum covering would not stay tight",solution:"studied an older drum and tightened opposite cords in pairs",lesson:"Studying an example and persisting can solve a difficult task"},gist:"Kwame studies an older drum and patiently changes his method to finish his project.",evidence:"Kwame noticed that opposite cords were tightened in pairs."},
{t:"The Debate Notes",a:"Gist Quest Studio",lv:3,text:"Sofia and Ren were preparing a short classroom debate about longer recess. They agreed on the topic, but both had collected the same reasons. Their presentation would sound repetitive and leave out other viewpoints. Sofia suggested dividing the research: Ren would examine how movement supports attention, while she would investigate scheduling concerns. They compared notes and respectfully addressed both benefits and challenges. Their balanced presentation persuaded the class to ask thoughtful questions rather than choose a side too quickly.",el:{somebody:"Sofia and Ren",setting:"classroom while preparing a debate",wanted:"prepare a strong debate about longer recess",challenge:"their reasons were repetitive and incomplete",solution:"divided the research and addressed both viewpoints",lesson:"Considering different viewpoints strengthens thinking"},gist:"Sofia and Ren divide their research to create a balanced and thoughtful debate.",evidence:"Sofia suggested dividing the research."},
{t:"The Lantern Trail",a:"Gist Quest Studio",lv:3,text:"At a neighborhood evening walk, Jun was responsible for placing paper lanterns along the marked path. A gust of wind kept tipping them over, and the walk would begin soon. Jun first tried heavier stones, but one stone tore a lantern. He reconsidered and asked the craft team for spare string. Together they tied each lantern loosely to a wooden stake, leaving enough space for the paper to move. The lanterns stayed upright and the path glowed safely. Jun learned that a solution should protect the thing it is meant to help.",el:{somebody:"Jun",setting:"a neighborhood evening walk",wanted:"place lanterns safely along the path",challenge:"wind kept tipping the lanterns over",solution:"tied lanterns loosely to stakes with string",lesson:"A good solution protects what it is meant to help"},gist:"Jun improves his plan and secures the lanterns without damaging them.",evidence:"Together they tied each lantern loosely to a wooden stake."},
{t:"The Last Puzzle Piece",a:"Gist Quest Studio",lv:3,text:"During indoor recess, Zahra's group nearly completed a five-hundred-piece puzzle. One corner piece seemed to be missing, and several students accused the previous class of losing it. Zahra thought that blaming others would not find the piece. She asked everyone to search one area carefully. Under the edge of the puzzle box, she found a piece with the plain side facing up. It fit the corner exactly. The group finished with time to spare and apologized for making assumptions. Zahra saw that evidence should come before blame.",el:{somebody:"Zahra",setting:"the classroom during indoor recess",wanted:"complete a large puzzle",challenge:"a corner piece seemed to be missing",solution:"organized a careful search and found the piece",lesson:"Look for evidence before blaming others"},gist:"Zahra leads a careful search that finds the puzzle piece and prevents unfair blame.",evidence:"She asked everyone to search one area carefully."},
{t:"Seeds for Spring",a:"Gist Quest Studio",lv:4,text:"Devin's science club planned to give seed packets to families at the spring fair. A week before the event, they discovered that several labels had faded in the sunny window. Without clear labels, families would not know whether they had herbs or flowers. Devin proposed planting one seed from each faded packet, but the sprouts would not appear in time. Then he remembered that the club had photographed the packets while counting them. By matching small marks and folded corners in the photographs, the students identified most packets. They labeled the few uncertain ones as a mixed surprise garden rather than pretending to know. Their honesty and careful records rescued the project.",el:{somebody:"Devin and the science club",setting:"school before the spring fair",wanted:"give correctly labeled seed packets to families",challenge:"several packet labels had faded",solution:"matched packets to photographs and honestly marked uncertain ones",lesson:"Careful records and honesty help solve uncertainty"},gist:"Devin's club uses photographs and honesty to fix faded labels before the spring fair.",evidence:"By matching small marks and folded corners in the photographs, the students identified most packets."}
];
const skills=["Gist","Character","Setting","Motivation","Challenge","Solution","Sequence","Lesson","Evidence","Capitalization","Punctuation","Grammar","Spelling","Complete sentence"];
const fresh=()=>({mastery:Object.fromEntries(skills.map(s=>[s,40])),attempts:0,first:0,revised:0,stars:0,passages:[],rubrics:[],history:[],errors:{},streak:0,lastDay:"",sound:true,font:17});let state;try{state=JSON.parse(localStorage.getItem("gistQuestV2"))||fresh()}catch(e){state=fresh()}let view="home",pi=0,selected=null,attempt=0,focusPara=0;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("gistQuestV2",JSON.stringify(state))}catch(e){}}function beep(ok=true){if(!state.sound)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?660:260;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}}
function toast(s){$("#toast").textContent=s;$("#toast").classList.remove("hidden");setTimeout(()=>$("#toast").classList.add("hidden"),2200)}function updateTop(){$("#stars").textContent="★ "+state.stars;$("#trail").style.width=Math.min(100,(state.attempts%10)*10)+"%";document.documentElement.style.fontSize=state.font+"px";$("#soundBtn").textContent=state.sound?"Sound on":"Muted"}
function record(ok,skill,error=""){state.attempts++;if(ok&&attempt===0)state.first++;if(ok){state.revised++;state.stars+=attempt?1:2;state.mastery[skill]=Math.min(100,(state.mastery[skill]||40)+(attempt?3:6));confetti();beep(true)}else{state.mastery[skill]=Math.max(0,(state.mastery[skill]||40)-3);state.errors[error||skill]=(state.errors[error||skill]||0)+1;beep(false)}state.history.unshift({date:new Date().toLocaleDateString(),mode:view,skill,ok,revision:attempt>0});state.history=state.history.slice(0,30);save();updateTop()}
function confetti(){let d=document.createElement("div");d.className="confetti";document.body.append(d);setTimeout(()=>d.remove(),900)}
function shell(title,body,pass=true){let p=pass?`<article class="passage" id="passage"><strong>${esc(passages[pi].t)}</strong><br><span class="small">by ${esc(passages[pi].a)}</span><p>${esc(passages[pi].text)}</p></article><div class="actions no-print"><button class="btn alt" onclick="document.getElementById('passage').scrollIntoView()">Read passage again</button><select aria-label="Choose passage" onchange="pi=+this.value;attempt=0;selected=null;render()">${passages.map((p,i)=>`<option value="${i}" ${i===pi?'selected':''}>${i+1}. ${esc(p.t)}</option>`).join('')}</select></div>`:"";return `<section class="card"><span class="eyebrow">${esc(view)}</span><h1 style="font-size:2.2rem">${esc(title)}</h1>${p}${body}</section>`}
function home(){return `<section class="hero"><span class="eyebrow">Grade 3 reading adventure</span><h1>Find the heart<br>of every story.</h1><p>Read closely. Think clearly. Write a strong answer. Every careful revision grows your skills.</p><button class="btn gold" data-go="learn">Begin today’s quest</button></section><section class="card"><h2>Your next best step</h2><p>${nextAdvice()}</p><div class="grid">${[["gist","🔎","Gist Detective"],["evidence","🔦","Evidence Hunter"],["sentence","✍️","Sentence Lab"],["map","🗺️","Full Story Map"]].map(x=>`<button class="mode" data-go="${x[0]}"><span class="badge">${x[1]}</span><h3>${x[2]}</h3><span class="small">Practice, get specific feedback, and revise.</span></button>`).join('')}</div></section><section class="card"><h2>Today’s trail</h2><div class="meter"><i style="width:${Math.min(100,(state.attempts%10)*10)}%"></i></div><p class="small">${state.attempts%10} of 10 practice steps completed • No pressure. A fresh trail begins whenever you return.</p></section>`}
function learn(){return shell("Learn the story compass",`<p><b>Gist</b> is the story’s most important idea, not every detail. A <b>recount</b> tells the important events in a clear order.</p><div class="grid">${[["Somebody","Who is the main character?"],["In","Where and when?"],["Wanted","What is the goal?"],["But","What gets in the way?"],["So","What action solves it?"],["Lesson","What can we learn?"]].map(x=>`<div class="mode"><span class="tag">${x[0]}</span><p>${x[1]}</p></div>`).join('')}</div><h2>Model the thinking</h2><p><b>Somebody:</b> Maya, not “a person.” <b>Wanted:</b> to plant twelve seedlings. <b>But:</b> three were missing. <b>So:</b> she followed the soil trail, found them, and planted them. <b>Lesson:</b> careful observation helps solve problems.</p><div class="feedback ok"><b>Strong gist:</b> ${passages[0].gist}<br><span class="small">It names the character, central problem-solving action, and outcome without listing every detail.</span></div><h2>Before you submit: CUPS + DETAIL</h2><p><b>C</b>apital • <b>U</b>nderstandable and complete • <b>P</b>unctuation • <b>S</b>pelling. Then name the character, answer the exact question, include the important detail, and point to evidence.</p><button class="btn" data-go="gist">Practice now</button>`,true)}
function gist(){let p=passages[pi],opts=[p.gist,`This story is about ${p.el.setting}.`,`${p.el.somebody} has an ordinary day.`,`The story explains every detail about ${p.el.wanted}.`].sort((a,b)=>a.localeCompare(b));return shell("Gist Detective",`<h2>Which sentence gives the best gist?</h2><div class="choices">${opts.map((o,i)=>`<button class="choice ${selected===o?'selected':''}" data-choice="${esc(o)}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><button class="btn" id="checkGist">Check my choice</button><div id="fb"></div>`)}
function sortMode(){let p=passages[pi],cards=Object.entries(p.el).map(([k,v])=>[k,v]).sort(()=>.5-Math.random());return shell("Story Element Sort",`<p>Select a clue, then choose its story-element home. This click method works with mouse, touch, or keyboard.</p><div class="tokens" id="sortTokens">${cards.map(([k,v])=>`<button class="token" data-key="${k}">${esc(v)}</button>`).join('')}</div><div class="sortgrid">${["somebody","setting","wanted","challenge","solution","lesson"].map(k=>`<button class="bin" data-bin="${k}"><b>${k[0].toUpperCase()+k.slice(1)}</b><span></span></button>`).join('')}</div><div id="fb"></div>`)}
function evidence(){let p=passages[pi],sent=p.text.match(/[^.!?]+[.!?]/g)||[],answer=pi%2?`What evidence shows how ${p.el.somebody} solved the challenge?`:`What evidence best supports the gist?`;return shell("Evidence Hunter",`<h2>${esc(answer)}</h2><p>An answer tells your idea. Evidence is the exact part of the text that proves it.</p><div class="choices">${sent.slice(0,6).map(s=>`<button class="choice" data-ev="${esc(s.trim())}">${esc(s.trim())}</button>`).join('')}</div><button class="btn" id="checkEv">Check evidence</button><div id="fb"></div>`)}
function sequence(){let p=passages[pi],items=[`${p.el.somebody} wanted to ${p.el.wanted}.`, `The challenge was that ${p.el.challenge}.`,`${p.el.somebody} ${p.el.solution}.`].sort(()=>.5-Math.random());return shell("Build the Recount",`<p>Put the beginning, middle, and end in order. Use the arrow buttons.</p><ol class="order" id="order">${items.map((x,i)=>`<li><span>${esc(x)}</span><button aria-label="Move up" data-up="${i}">↑</button><button aria-label="Move down" data-down="${i}">↓</button></li>`).join('')}</ol><button class="btn" id="checkSeq">Check order</button><div id="fb"></div>`)}
const fixes=[{bad:"the character are Maya.",good:"The character is Maya.",why:"A sentence begins with a capital, and the singular subject ‘character’ needs ‘is.’"},{bad:"A person followed the soil trale",good:"Maya followed the soil trail.",why:"Name the character, copy ‘trail’ carefully, and add end punctuation."},{bad:"They wanted to finish his drum.",good:"Kwame wanted to finish his drum.",why:"Use the character’s name so the pronoun is clear and correct."},{bad:"Because the rain covered the track.",good:"The race could not begin because the rain covered the track.",why:"The first version is a fragment. Add a complete idea."}];
function sentence(){let f=fixes[pi%fixes.length],words=(pi%2?["The","students","sorted","the","books","carefully","."]:["Maya","followed","the","soil","trail","."]);return shell("Sentence Lab",`<h2>1. Build a complete sentence</h2><p>Tap the words in the correct order.</p><div class="tokens" id="wordBank">${words.sort(()=>.5-Math.random()).map(w=>`<button class="token" data-word="${w}">${w}</button>`).join('')}</div><input id="built" type="text" readonly aria-label="Built sentence"><button class="btn" id="checkBuilt">Check sentence</button><h2>2. Fix the sentence</h2><p class="feedback warn">${esc(f.bad)}</p><textarea id="fixText" rows="2" aria-label="Corrected sentence">${esc(f.bad)}</textarea><button class="btn" id="checkFix">Check my edit</button><div id="fb"></div>`,false)}
function checks(){return `<div class="checks"><label><input type="checkbox" class="review"> C: Capital letters</label><label><input type="checkbox" class="review"> U: Complete and clear</label><label><input type="checkbox" class="review"> P: End punctuation</label><label><input type="checkbox" class="review"> S: Spelling checked</label><label><input type="checkbox" class="review"> DETAIL: Exact question</label><label><input type="checkbox" class="review"> DETAIL: Evidence included</label></div>`}
function answer(){let p=passages[pi],q=["Who is the main character, and what does the character want?","What is the central challenge?","How is the challenge solved?","What lesson does the story teach?"][pi%4];return shell("Type Your Answer",`<h2>${q}</h2><textarea id="open" rows="4" placeholder="Write a complete sentence. Your work is saved while you stay on this activity."></textarea>${checks()}<button class="btn" id="scoreOpen">Submit for feedback</button><div id="fb"></div><p class="small">Automated feedback is supportive. A parent or teacher can review reasonable answers that use different words.</p>`)}
function best(){let p=passages[pi],answers=[p.gist,`A person did a thing and it worked.`,`${p.el.somebody} wanted ${p.el.wanted}.`];return shell("Best Answer Challenge",`<h2>Which response is specific, complete, text-based, and concise?</h2><div class="choices">${answers.sort(()=>.5-Math.random()).map(a=>`<button class="choice" data-best="${esc(a)}">${esc(a)}</button>`).join('')}</div><div id="fb"></div>`)}
function map(){let names=[["Title","title"],["Author","author"],["Somebody","somebody"],["In","setting"],["Wanted","wanted"],["But","challenge"],["So","solution"],["Lesson or moral","lesson"]];return shell("Full Story Map",`<form id="mapForm"><div class="grid">${names.map(x=>`<label><b>${x[0]}</b><textarea rows="2" name="${x[1]}" required></textarea></label>`).join('')}</div>${checks()}<button class="btn" type="submit">Check my story map</button></form><div id="fb"></div>`)}
function mastery(){pi=Math.max(pi,9);return shell("Final Mastery Quest",`<p>No hints this time. Complete all four parts carefully.</p><label><b>One-sentence gist</b><textarea id="mGist" rows="2"></textarea></label><label><b>Three-to-five-sentence recount</b><textarea id="mRec" rows="6"></textarea></label><label><b>Lesson supported by the text</b><textarea id="mLesson" rows="3"></textarea></label>${checks()}<button class="btn gold" id="checkMastery">Complete mastery quest</button><div id="fb"></div>`)}
function parent(){let avg=Math.round(Object.values(state.mastery).reduce((a,b)=>a+b,0)/skills.length),weak=[...skills].sort((a,b)=>state.mastery[a]-state.mastery[b]).slice(0,3),errs=Object.entries(state.errors).sort((a,b)=>b[1]-a[1]).slice(0,5);return shell("Parent or Teacher Dashboard",`<div class="grid"><div class="mode"><span class="small">Overall mastery</span><h2>${avg}%</h2></div><div class="mode"><span class="small">Questions attempted</span><h2>${state.attempts}</h2></div><div class="mode"><span class="small">First-attempt accuracy</span><h2>${state.attempts?Math.round(state.first/state.attempts*100):0}%</h2></div><div class="mode"><span class="small">Accuracy after revision</span><h2>${state.attempts?Math.round(state.revised/state.attempts*100):0}%</h2></div><div class="mode"><span class="small">Passages completed</span><h2>${new Set(state.passages).size}</h2></div><div class="mode"><span class="small">Average rubric</span><h2>${state.rubrics.length?(state.rubrics.reduce((a,b)=>a+b,0)/state.rubrics.length).toFixed(1):0}/10</h2></div></div><h2>Mastery by skill</h2>${skills.map(s=>`<div class="skillrow"><span>${s}</span><div class="meter"><i style="width:${state.mastery[s]}%"></i></div><b>${state.mastery[s]}</b></div>`).join('')}<h2>Intervention priorities</h2><p>${weak.join(", ")}. Suggested next activity: ${nextAdvice()}</p><h2>Common errors</h2><p>${errs.length?errs.map(e=>`${esc(e[0])}: ${e[1]}`).join(" • "):"No errors recorded yet."}</p><h2>Recent practice</h2><table class="rubric"><tr><th>Date</th><th>Mode</th><th>Skill</th><th>Result</th></tr>${state.history.slice(0,8).map(h=>`<tr><td>${h.date}</td><td>${h.mode}</td><td>${h.skill}</td><td>${h.ok?'Correct':'Revised'}</td></tr>`).join('')}</table><div class="actions no-print"><button class="btn alt" onclick="window.print()">Print report & worksheet</button><button class="btn alt" id="exportJson">Export progress</button><button class="btn alt" id="importJson">Import progress</button><button class="btn danger" id="reset">Reset progress</button></div><section class="mapblank"><h2>Blank Story Map Worksheet</h2>${["Title","Author","Somebody","In","Wanted","But","So","Lesson or moral"].map(x=>`<p><b>${x}:</b> ________________________________________________________________</p>`).join('')}</section>`,false)}
function nextAdvice(){let w=[...skills].sort((a,b)=>state.mastery[a]-state.mastery[b])[0];return w==="Evidence"?"Use Evidence Hunter to connect ideas to exact words.":w==="Gist"?"Try Gist Detective and reject answers that are too narrow.":["Capitalization","Punctuation","Grammar","Spelling","Complete sentence"].includes(w)?"Visit Sentence Lab and revise each sentence carefully.":"Complete a Full Story Map to connect every story element."}
function render(){document.querySelectorAll(".side button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));let f={home,learn,gist,sort:sortMode,evidence,sequence,sentence,answer,best,map,mastery,parent}[view]||home;$("#content").innerHTML=f();bind();updateTop();$("#content").focus()}
function feedback(msg,ok=false){$("#fb").innerHTML=`<div class="feedback ${ok?'ok':'warn'}">${msg}</div>`}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;attempt=0;selected=null;render()});
document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x===b))});if($("#checkGist"))$("#checkGist").onclick=()=>{if(!selected)return feedback("Choose one answer first.");let p=passages[pi],ok=selected===p.gist;if(ok){record(true,"Gist");feedback("✓ Strong choice. It includes the character, central challenge or action, and outcome without listing every detail.",true)}else{record(false,"Gist","too narrow or vague gist");attempt++;feedback(attempt===1?"This choice is true or related, but it is too narrow, broad, or incomplete. Look for the answer that captures the whole story.":`Look for the option that names ${esc(p.el.somebody)} and the central action. Revise before continuing.`)}};
let held=null;document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{held={key:b.dataset.key,text:b.textContent,el:b};document.querySelectorAll(".token").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});document.querySelectorAll("[data-bin]").forEach(b=>b.onclick=()=>{if(!held)return toast("Choose a clue first.");let ok=held.key===b.dataset.bin;if(ok){b.querySelector("span").textContent=" ✓ "+held.text;held.el.disabled=true;held.el.classList.add("used");record(true,b.dataset.bin[0].toUpperCase()+b.dataset.bin.slice(1));held=null;feedback("✓ The clue matches that story element.",true)}else{record(false,b.dataset.bin,"element confusion");attempt++;feedback(`That clue does not answer “${b.dataset.bin}.” Read what the label asks, then place the clue again.`)}});
document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{selected=b.dataset.ev;document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x===b))});if($("#checkEv"))$("#checkEv").onclick=()=>{if(!selected)return feedback("Select a sentence from the passage.");let p=passages[pi],keys=p.evidence.toLowerCase().split(/\W+/).filter(w=>w.length>4),ok=keys.filter(k=>selected.toLowerCase().includes(k)).length>=2;if(ok){record(true,"Evidence");feedback("✓ This sentence directly proves the answer. Evidence is not just related; it must support the idea.",true)}else{record(false,"Evidence","weak evidence");attempt++;feedback(attempt<2?"That sentence is related, but it does not best prove the solution. Find the sentence showing the important action.":`Strong evidence begins: “${esc(p.evidence.split(' ').slice(0,6).join(' '))}…” Revise your selection.`)}};
if($("#order")){let list=$("#order");list.onclick=e=>{let li=e.target.closest("li");if(!li)return;if(e.target.dataset.up!==undefined&&li.previousElementSibling)list.insertBefore(li,li.previousElementSibling);if(e.target.dataset.down!==undefined&&li.nextElementSibling)list.insertBefore(li.nextElementSibling,li)};$("#checkSeq").onclick=()=>{let txt=[...list.children].map(x=>x.textContent);let ok=txt[0].includes("wanted")&&txt[1].includes("challenge");if(ok){record(true,"Sequence");feedback("✓ Beginning, middle, and end are in logical order. Use words such as first, but, then, and finally in a recount.",true)}else{record(false,"Sequence","sequence");attempt++;feedback("Start with the goal, place the challenge in the middle, and finish with the solution. Rearrange and check again.")}}}
if($("#wordBank"))document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");let v=$("#built").value;$("#built").value=(v+(b.dataset.word==="."?"":" ")+b.dataset.word).trim()});if($("#checkBuilt"))$("#checkBuilt").onclick=()=>{let v=$("#built").value,ok=/^[A-Z].*[.!?]$/.test(v)&&v.split(/\s+/).length>=5;record(ok,"Complete sentence",ok?"":"sentence construction");feedback(ok?"✓ Complete sentence: capital letter, clear word order, and punctuation.":"Check the first letter, word order, and end punctuation. Tap the activity again to rebuild it.",ok)};if($("#checkFix"))$("#checkFix").onclick=()=>{let f=fixes[pi%fixes.length],v=$("#fixText").value.trim(),ok=v.toLowerCase()===f.good.toLowerCase();record(ok,ok?"Grammar":"Spelling",ok?"":"editing convention");if(!ok)attempt++;feedback(ok?`✓ ${f.why}`:`One more edit: ${f.why}<br><b>Model after your attempt:</b> ${esc(f.good)}`,ok)};
if($("#scoreOpen"))$("#scoreOpen").onclick=()=>scoreOpen($("#open").value);document.querySelectorAll("[data-best]").forEach(b=>b.onclick=()=>{let ok=b.dataset.best===passages[pi].gist;record(ok,"Gist",ok?"":"vague answer");if(!ok)attempt++;feedback(ok?"✓ This answer is specific, complete, supported, and concise.":"This answer is either vague or incomplete. Choose the response that names the character and captures the central story.",ok)});if($("#mapForm"))$("#mapForm").onsubmit=e=>{e.preventDefault();if(!reviewed())return feedback("Complete the CUPS and DETAIL review before submitting.");let d=Object.fromEntries(new FormData(e.target)),p=passages[pi],score=0;["title","author"].forEach(k=>{if(norm(d[k]).includes(norm(k==="title"?p.t:p.a)))score++});["somebody","setting","wanted","challenge","solution","lesson"].forEach(k=>{if(overlap(d[k],p.el[k])>=.25)score++});let out=Math.round(score/8*10);state.rubrics.push(out);state.passages.push(pi);record(out>=7,"Gist",out>=7?"":"story map detail");feedback(`Story map score: <b>${out}/10</b>. ${out>=7?'Strong connections across the story elements.':'Revise the fields that need more specific details from the passage.'}`,out>=7)};
if($("#checkMastery"))$("#checkMastery").onclick=()=>{if(!reviewed())return feedback("Complete your final CUPS and DETAIL review.");let p=passages[pi],g=$("#mGist").value,r=$("#mRec").value,l=$("#mLesson").value,score=0;score+=Math.min(4,Math.round(overlap(g,p.gist)*6));score+=r.split(/[.!?]+/).filter(x=>x.trim()).length>=3?3:1;score+=overlap(l,p.el.lesson)>.2?2:0;score+=/^[A-Z]/.test(g)&&/[.!?]$/.test(g.trim())?1:0;state.rubrics.push(score);state.passages.push(pi);record(score>=7,"Gist",score>=7?"":"mastery response");feedback(`<b>${score}/10</b><br>Strength: you completed an independent response. Priority: ${score>=7?'keep answers concise and evidence-based':'include the central challenge, solution, and a supported lesson'}. You may revise for a higher score.`,score>=7)};
if($("#exportJson"))$("#exportJson").onclick=()=>download("gist-quest-progress.json",JSON.stringify(state,null,2),"application/json");if($("#importJson"))$("#importJson").onclick=()=>$("#importFile").click();if($("#reset"))$("#reset").onclick=()=>{if(confirm("Reset all Gist Quest progress? This cannot be undone unless you exported a copy.")){state=fresh();save();render()}}}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"")}function overlap(a,b){let x=new Set(norm(a).split(/\s+/).filter(w=>w.length>3)),y=norm(b).split(/\s+/).filter(w=>w.length>3);return y.length?y.filter(w=>x.has(w)).length/y.length:0}function reviewed(){let c=[...document.querySelectorAll(".review")];return c.length&&c.every(x=>x.checked)}
function scoreOpen(v){if(!reviewed())return feedback("Pause and complete every CUPS and DETAIL check before submitting.");if(v.trim().length<12){record(false,"Complete sentence","fragment");attempt++;return feedback("Your answer needs a complete idea. Name the character or subject and explain the important detail.")}let p=passages[pi],target=[p.el.somebody+" "+p.el.wanted,p.el.challenge,p.el.solution,p.el.lesson][pi%4],idea=overlap(v,target),cap=/^[A-Z]/.test(v.trim()),pun=/[.!?]$/.test(v.trim()),complete=v.trim().split(/\s+/).length>=5,score=(idea>.12?4:2)+(idea>.3?2:0)+(complete?2:0)+(cap?1:0)+(pun?1:0);state.rubrics.push(score);let ok=score>=7;record(ok,idea>.12?"Complete sentence":"Challenge",ok?"":!cap?"capitalization":!pun?"punctuation":"missing detail");if(!ok)attempt++;feedback(`<b>Rubric score: ${score}/10</b><br>Strength: ${idea>.12?'Your idea connects to the text.':'You attempted the exact question.'}<br>Priority: ${!cap?'Begin with a capital letter.':!pun?'Add end punctuation.':idea<=.3?'Add the specific story detail.':'Make the sentence complete.'}<br>${ok?'✓ Strong response.':'Revise and submit again. Your before-and-after scores will be saved.'}`,ok)}
function download(name,text,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.querySelectorAll(".side button").forEach(b=>b.onclick=()=>{view=b.dataset.view;attempt=0;selected=null;render()});$("#fontBtn").onclick=()=>{state.font=state.font>=21?16:state.font+1;save();updateTop()};$("#soundBtn").onclick=()=>{state.sound=!state.sound;save();updateTop()};$("#importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.mastery||!x.history)throw Error();state=x;save();toast("Progress imported.");render()}catch(err){alert("That file is not a valid Gist Quest progress file.")}};r.readAsText(f)};render();
</script></body></html>
