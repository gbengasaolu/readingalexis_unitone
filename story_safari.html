<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Safari – Grade 3 Reading Mastery Camp</title>
<meta name="description" content="Interactive Grade 3 reading practice: context clues, text purpose, story elements, affixes, character feelings, and finding text evidence.">
<style>
:root{
  --jungle:#1f5c3f; --jungle-d:#143d2a; --leaf:#3ea86b; --leaf-l:#d9f2e3;
  --sun:#f6b73c; --sun-d:#c98a12; --clay:#d9683b; --clay-d:#a94a24;
  --cream:#fff9ea; --sand:#f4e4bc; --sand-d:#e2c98a; --ink:#2b2117;
  --sky:#d5eef4; --berry:#7d4fbf; --berry-l:#ece2fa; --blue:#2f84b8; --red:#d6453d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); min-height:100vh;
  font-family:"Trebuchet MS","Segoe UI","Comic Sans MS",system-ui,sans-serif;
  font-size:18px; line-height:1.55;
  background:linear-gradient(180deg,var(--sky) 0,#eaf6e6 260px,var(--sand) 100%) fixed;
}
button{font-family:inherit}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;opacity:.16;font-size:2.6rem;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}

header{
  position:relative;z-index:2;text-align:center;padding:26px 16px 10px;
}
header h1{
  margin:0;font-size:clamp(1.9rem,5.4vw,3.1rem);color:var(--jungle-d);letter-spacing:.5px;
  text-shadow:3px 3px 0 var(--sun);
}
header p{margin:6px 0 0;color:var(--jungle);font-weight:bold}

nav{
  position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:10px 10px 12px;background:rgba(255,249,234,.95);backdrop-filter:blur(4px);
  box-shadow:0 4px 12px rgba(43,33,23,.12);
}
nav button{
  border:0;border-radius:30px;padding:9px 15px;font-weight:bold;font-size:.9rem;cursor:pointer;
  background:var(--sand-d);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s;
}
nav button:hover{transform:translateY(-2px);background:var(--sun)}
nav button.active{background:var(--jungle);color:#fff;box-shadow:0 3px 0 var(--jungle-d)}

main{position:relative;z-index:2;max-width:960px;margin:0 auto;padding:14px 14px 60px}
.page{display:none;animation:fade .35s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.panel{
  background:var(--cream);border:4px solid var(--sand-d);border-radius:22px;padding:22px;margin-bottom:22px;
  box-shadow:0 8px 20px rgba(43,33,23,.12);
}
h2{margin:0 0 10px;color:var(--jungle-d);font-size:1.55rem}
h3{margin:14px 0 6px;color:var(--jungle)}
p{margin:.5em 0}

/* mascot */
.mascot{display:flex;gap:14px;align-items:flex-start;margin:10px 0}
.mascot .face{font-size:3rem;line-height:1;flex-shrink:0}
.bubble{
  background:#fff;border:3px solid var(--sun);border-radius:18px;padding:12px 16px;position:relative;font-size:1.02rem;
}
.bubble:before{content:"";position:absolute;left:-12px;top:18px;border:8px solid transparent;border-right-color:var(--sun);border-left:0}

/* buttons */
.btn{
  border:0;border-radius:30px;padding:11px 22px;font-weight:bold;font-size:1rem;cursor:pointer;color:#fff;
  background:var(--clay);box-shadow:0 4px 0 var(--clay-d);transition:transform .12s;margin:4px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--clay-d)}
.btn.green{background:var(--leaf);box-shadow:0 4px 0 #2b8250}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #1f5f87}
.btn.purple{background:var(--berry);box-shadow:0 4px 0 #583593}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{text-align:center}

/* home */
.stats{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.stat-big{font-size:1.5rem;font-weight:bold}
.level-chip{background:var(--jungle);color:#fff;padding:5px 14px;border-radius:20px;font-weight:bold}
.bar{height:20px;background:#fff;border:3px solid var(--sand-d);border-radius:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8fdcae);width:0;transition:width .6s}
.skill-row{display:grid;grid-template-columns:44px 1fr 90px;gap:10px;align-items:center;margin:10px 0}
.skill-row .nm{font-weight:bold;font-size:.98rem}
.skill-row .pc{text-align:right;font-weight:bold;font-size:.9rem}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{
  background:linear-gradient(145deg,#fff,var(--sand));border:3px solid var(--sand-d);border-radius:18px;padding:16px 12px;
  text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--sand-d);transition:transform .15s;
}
.tile:hover{transform:translateY(-4px)}
.tile .em{font-size:2.3rem;display:block}
.tile b{display:block}
.tile small{display:block;opacity:.8;line-height:1.3;margin-top:3px}
.badge{display:inline-block;background:var(--sun);color:var(--ink);padding:5px 12px;border-radius:18px;font-weight:bold;font-size:.85rem;margin:3px;box-shadow:0 3px 0 var(--sun-d)}
.name-in{font:inherit;padding:8px 12px;border:3px solid var(--sand-d);border-radius:12px;width:220px;max-width:100%}

/* lessons */
.lesson-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lesson-tabs button{
  border:3px solid var(--sand-d);background:#fff;border-radius:16px;padding:8px 12px;font-weight:bold;cursor:pointer;font-size:.88rem;
}
.lesson-tabs button.active{background:var(--jungle);color:#fff;border-color:var(--jungle-d)}
.lesson-tabs button.done:after{content:" ✅"}
.big-idea{background:var(--leaf-l);border-left:8px solid var(--leaf);padding:12px 16px;border-radius:12px;margin:12px 0;font-size:1.08rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
.steps li{counter-increment:s;background:#fff;border:3px solid var(--sand-d);border-radius:14px;padding:10px 14px 10px 54px;margin:8px 0;position:relative}
.steps li:before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--clay);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center}
.example{background:#fff;border:3px dashed var(--blue);border-radius:14px;padding:12px 16px;margin:12px 0}
.example .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:10px;padding:2px 10px;font-weight:bold;font-size:.8rem;margin-bottom:6px}
.trap{background:#fdeae3;border-left:8px solid var(--clay);padding:12px 16px;border-radius:12px;margin:12px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:2px solid var(--sand-d);padding:6px 9px;text-align:left}
.tbl th{background:var(--sand)}
.hl{background:#fff2a8;padding:0 3px;border-radius:4px}
.pre{color:var(--clay-d);font-weight:bold}.suf{color:var(--berry);font-weight:bold}.root{color:var(--jungle);font-weight:bold}

/* question widget */
.qwrap{margin:14px 0}
.qtext{font-weight:bold;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--sand-d);border-radius:14px;
  padding:10px 14px;font-size:1rem;cursor:pointer;transition:background .12s,transform .1s;
}
.opt:hover:not(:disabled){background:var(--sand);transform:translateX(3px)}
.opt .letter{background:var(--sand-d);border-radius:50%;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85rem}
.opt.correct{background:var(--leaf);color:#fff;border-color:#2b8250}
.opt.wrong{background:var(--red);color:#fff;border-color:#9e2d27}
.opt.sel{background:var(--sun);border-color:var(--sun-d)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:.98rem}
.fb.good{background:#d7f5e3;color:#176340}
.fb.bad{background:#fde1db;color:#8f3220}
.fb.info{background:#e8f3fa;color:#1d4d6b}
.clue{border-bottom:3px dotted transparent}
.clue.show{background:#fff2a8;border-bottom-color:var(--clay);border-radius:4px;padding:0 2px}
textarea.wr{width:100%;min-height:96px;font:inherit;padding:10px 12px;border:3px solid var(--sand-d);border-radius:12px;resize:vertical}
.chips span{display:inline-block;border-radius:14px;padding:3px 11px;margin:3px;font-size:.9rem;font-weight:bold}
.chips .y{background:#d7f5e3;color:#176340}.chips .n{background:#fde1db;color:#8f3220}
.model{background:var(--berry-l);border-left:8px solid var(--berry);border-radius:12px;padding:10px 14px;margin-top:10px}

/* passages */
.passage{
  background:#fffef7;border:3px solid var(--sand-d);border-radius:16px;padding:18px 22px;margin:12px 0;
  font-family:Georgia,"Times New Roman",serif;font-size:1.12rem;line-height:1.75;
}
.passage .ptitle{font-family:inherit;font-weight:bold;font-size:1.25rem;text-align:center;margin-bottom:8px}
.passage .ptype{font-family:"Trebuchet MS",sans-serif;font-size:.8rem;text-align:center;color:var(--berry);font-weight:bold;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.passage p{margin:.7em 0;text-indent:1.2em}
.passage.poem p{text-indent:0;margin:.2em 0}
.passage.poem .stanza{margin:.9em 0}
.passage .s{border-radius:5px;transition:background .12s}
.passage .ln{display:block;border-radius:5px}
.passage.pick .s:hover,.passage.pick .ln:hover{background:#ffe69a;cursor:pointer}
.passage .picked{background:#ffd35c!important;box-shadow:0 0 0 2px var(--sun-d)}
.passage .right-line{background:#8fdcae!important}
.passage .wrong-line{background:#f6b5ac!important}
.passage-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.small-btn{border:2px solid var(--blue);color:var(--blue);background:#fff;border-radius:12px;padding:4px 12px;font-weight:bold;cursor:pointer;font-size:.88rem}
.small-btn:hover{background:var(--blue);color:#fff}
.stepper{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.pill{background:var(--berry-l);color:var(--berry);border-radius:14px;padding:2px 12px;font-weight:bold;font-size:.82rem}
.lvl{font-size:.78rem;font-weight:bold;color:#fff;border-radius:10px;padding:1px 9px;margin-left:6px}
.lvl1{background:var(--leaf)}.lvl2{background:var(--sun-d)}.lvl3{background:var(--clay)}

.lab-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pcard{background:#fff;border:3px solid var(--sand-d);border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s}
.pcard:hover{transform:translateY(-3px)}
.pcard .em{font-size:2rem}
.pcard b{display:block}
.pcard small{opacity:.8}
.pcard.done{border-color:var(--leaf);background:#f1fbf4}

/* games */
.game-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.game-tabs button{border:3px solid var(--sand-d);background:#fff;border-radius:16px;padding:8px 12px;font-weight:bold;cursor:pointer;font-size:.88rem}
.game-tabs button.active{background:var(--clay);color:#fff;border-color:var(--clay-d)}
.scorebar{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:8px;flex-wrap:wrap}
.ord{list-style:none;padding:0;margin:10px 0}
.ord li{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--sand-d);border-radius:14px;padding:8px 12px;margin:8px 0}
.ord li.good{border-color:var(--leaf);background:#eefaf2}
.ord li.bad{border-color:var(--red);background:#fdecea}
.ord .n{background:var(--blue);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.ord .tx{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{border:2px solid var(--sand-d);background:var(--sand);border-radius:8px;cursor:pointer;font-size:.8rem;padding:0 8px}
.ord .mv button:hover{background:var(--sun)}
.chips-pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips-pick button{border:3px solid var(--sand-d);background:#fff;border-radius:16px;padding:6px 14px;font-weight:bold;cursor:pointer;font-size:1rem}
.chips-pick button.on{background:var(--sun);border-color:var(--sun-d)}
.lab-out{background:#fff;border:3px solid var(--leaf);border-radius:16px;padding:14px;text-align:center;min-height:110px}
.lab-out .big{font-size:2rem;font-weight:bold}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media(max-width:560px){.mem-grid{grid-template-columns:repeat(3,1fr)}.skill-row{grid-template-columns:34px 1fr 64px}}
.mem{min-height:84px;background:var(--jungle);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;cursor:pointer;padding:6px;font-size:.92rem;box-shadow:0 4px 0 var(--jungle-d);user-select:none}
.mem.up{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--sand-d);border:3px solid var(--sand-d)}
.mem.ok{background:var(--leaf);color:#fff;opacity:.75}

/* test */
.test-card{background:#fff;border:3px solid var(--sand-d);border-radius:16px;padding:14px 16px;margin:14px 0}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.res{background:#fff;border:3px solid var(--sand-d);border-radius:14px;padding:10px;text-align:center}
.res b{font-size:1.4rem;display:block}
.cert{
  border:8px double var(--sun-d);background:#fffdf2;border-radius:16px;padding:26px;text-align:center;margin:16px 0;
}
.cert h2{font-size:2rem;color:var(--sun-d)}
.cert .nm{font-size:2rem;font-weight:bold;color:var(--jungle-d);border-bottom:3px solid var(--sun);display:inline-block;padding:0 24px;margin:6px 0}

.confetti{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;z-index:999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(360deg);opacity:.3}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--jungle-d);color:#fff;padding:10px 20px;border-radius:24px;z-index:998;font-weight:bold;box-shadow:0 6px 16px rgba(0,0,0,.3)}
footer{position:relative;z-index:2;text-align:center;padding:18px;font-size:.85rem;opacity:.75}
.kbd-hint{font-size:.85rem;opacity:.75}
.parent p,.parent li{font-size:1rem}
.parent .tbl td,.parent .tbl th{font-size:.92rem}
@media print{
  body{background:#fff}.deco,header,nav,footer,.noprint,.btn{display:none!important}
  .page{display:none!important}.page.printme{display:block!important}
  .panel{box-shadow:none;border:1px solid #999;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>

<header>
  <h1>🐆 Story Safari 🦎</h1>
  <p>Grade 3 Reading Mastery Camp &nbsp;•&nbsp; Mid-Unit 1 Assessment Prep</p>
</header>

<nav id="nav" aria-label="Main sections">
  <button data-p="home" class="active">🏠 Base Camp</button>
  <button data-p="learn">📚 Learn</button>
  <button data-p="games">🎮 Games</button>
  <button data-p="lab">📖 Passages</button>
  <button data-p="test">🏆 Practice Tests</button>
  <button data-p="parent">👨‍👩‍👧 Parent Page</button>
</nav>

<main>
  <section class="page active" id="home"></section>
  <section class="page" id="learn"></section>
  <section class="page" id="games"></section>
  <section class="page" id="lab"></section>
  <section class="page" id="test"></section>
  <section class="page parent" id="parent"></section>
</main>

<footer>Built for curious readers. Every question here is original practice written to match the skills on the Mid-Unit 1 review sheet. Keep going – you're doing great! 🌟</footer>

<script>
/* ================= CONTENT DATA ================= */
const SKILLS = {
  context:{em:'🔎',name:'Word Detective (Context Clues)',color:'#2f84b8'},
  purpose:{em:'🎯',name:'Why Was It Written? (Text Purpose)',color:'#7d4fbf'},
  story:{em:'🏔️',name:'Story Parts (Characters, Setting, Plot)',color:'#3ea86b'},
  affix:{em:'🧩',name:'Affix Power (Prefixes & Suffixes)',color:'#d9683b'},
  feelings:{em:'💭',name:'Inside the Character (Thoughts, Feelings, Actions)',color:'#c98a12'},
  evidence:{em:'📍',name:'Proof Finder (Which Line Shows It?)',color:'#1f5c3f'}
};
const SKILL_KEYS = Object.keys(SKILLS);

/* ---------- LESSONS ---------- */
const LESSONS = [
{id:'context',skill:'context',em:'🔎',title:'Context Clues',
 big:'A <b>context clue</b> is a hint hiding in the words and sentences <i>around</i> a tricky word. You don\'t need a dictionary – the sentence will help you!',
 steps:[
  '<b>Circle it.</b> Spot the word you don\'t know.',
  '<b>Look around.</b> Read the whole sentence, then the sentence before and after it.',
  '<b>Use clue words.</b> Watch for <i>means, is called, such as, like, or</i> (the word is explained) and <i>but, unlike, instead</i> (the word is the opposite).',
  '<b>Swap and check.</b> Put your guess in place of the tricky word. Does the sentence still make sense?'],
 ex:`<span class="tag">Example from "The Chameleon"</span><br><i>Sometimes you're yellow, then you're green, turquoise blue, or <b>tangerine</b>.</i><br>
 Yellow, green, turquoise blue… every word in the list is a <span class="hl">color</span>. So <b>tangerine</b> must be a color too – a bright orange!`,
 trap:'<b>Careful!</b> You may already know <i>tangerine</i> as a fruit. But the question asks what it means <b>in this poem</b>. The words around it decide – and they are all colors. Always let the text, not just your memory, vote.',
 extra:`<h3>Four kinds of clue</h3>
 <table class="tbl"><tr><th>Clue type</th><th>Looks like</th></tr>
 <tr><td>Definition</td><td>A <b>cub</b> is a baby leopard. (<i>is</i> = it tells you!)</td></tr>
 <tr><td>Example / list</td><td>He wore bright colors, <b>such as</b> red and gold.</td></tr>
 <tr><td>Opposite</td><td>Unlike her <i>brave</i> brother, the kitten was <b>timid</b>.</td></tr>
 <tr><td>Whole sentence</td><td>The sun was <b>scorching</b>; we hopped on the hot sand.</td></tr></table>`,
 check:[
  {q:'"The turtle was <b>wise</b>. He knew everything about the jungle and gave good advice." What does <b>wise</b> mean?',opts:['silly','smart and thoughtful','very small'],a:1,why:'"Knew everything" and "gave good advice" are the clues.'},
  {q:'"Sam was <b>famished</b> after the long hike, so he ate three sandwiches." What does <b>famished</b> mean?',opts:['very hungry','very sleepy','very cold'],a:0,why:'He ate three sandwiches – the clue shows he was very hungry.'},
  {q:'"Unlike her brave brother, the kitten was <b>timid</b>. She hid under the bed." What does <b>timid</b> mean?',opts:['shy and easily scared','loud and silly','hungry'],a:0,why:'"Unlike her brave brother" tells you timid is the opposite of brave.'}]},

{id:'purpose',skill:'purpose',em:'🎯',title:'Purpose of a Text',
 big:'The <b>purpose</b> is <i>why the author wrote it</i>. Think <b>P.I.E.</b> – <b>P</b>ersuade, <b>I</b>nform, <b>E</b>ntertain – plus one special story type: the <b>pourquoi tale</b>.',
 steps:[
  '<b>Look at the text type.</b> Is it a story, poem, fact article, ad, or how-to?',
  '<b>Listen for clues.</b> Characters and events → entertain. Facts and numbers → inform. "You should…", "Best ever!" → persuade. Numbered steps → teach how-to.',
  '<b>Match the choice.</b> Pick the answer that fits the <i>whole</i> text, not just one small part.'],
 ex:`<span class="tag">Example from "How the Leopard Got Its Spots"</span><br>
 <b>Pourquoi</b> (poor-KWAH) is French for <b>"why."</b> A pourquoi tale is a made-up story that explains <span class="hl">why something in nature is the way it is</span> – why leopards have spots, why owls hunt at night. The last line of the story says it: <i>"And that's how the leopard got his spots."</i>`,
 trap:'<b>Lesson ≠ purpose!</b> The leopard story <i>does</i> teach that patience and bravery matter. That is the <b>lesson (theme)</b>. But the <b>purpose</b> of a pourquoi tale is to answer the "why" question. When a choice says <i>"answer the pourquoi question and tell a story about why…"</i>, that is the purpose.',
 extra:`<table class="tbl"><tr><th>Purpose</th><th>Text types</th><th>Clue words</th></tr>
 <tr><td>Entertain</td><td>stories, poems, plays</td><td>characters, dialogue, fun sounds</td></tr>
 <tr><td>Inform</td><td>articles, science books</td><td>facts, numbers, "are", "can"</td></tr>
 <tr><td>Persuade</td><td>ads, opinion, letters</td><td>should, must, best, "Join us!"</td></tr>
 <tr><td>Explain why (pourquoi)</td><td>folktales</td><td>"long ago…", "that is why…"</td></tr>
 <tr><td>Teach how-to</td><td>recipes, directions</td><td>first, next, step 1</td></tr></table>`,
 check:[
  {q:'"Try Crunchy Bites! They are the tastiest cereal ever, and you will love them." What is the purpose?',opts:['to entertain','to persuade you to buy it','to explain why'],a:1,why:'"Tastiest ever" and "you will love them" try to change your mind – persuade.'},
  {q:'A story tells why the zebra has stripes. What is its purpose?',opts:['to explain why something in nature is the way it is','to give directions','to sell zebras'],a:0,why:'That is the job of a pourquoi tale.'},
  {q:'A book has photos, facts, and a glossary about volcanoes. What is its purpose?',opts:['to persuade','to inform','to entertain with rhymes'],a:1,why:'Facts and a glossary = inform.'}]},

{id:'story',skill:'story',em:'🏔️',title:'Characters, Setting & Plot',
 big:'Every story has <b>characters</b> (who), a <b>setting</b> (where and when), and a <b>plot</b> (what happens): a <b>problem</b>, the <b>events</b> that follow, and a <b>solution</b>.',
 steps:[
  '<b>Characters:</b> who is in the story? Who matters most?',
  '<b>Setting:</b> where and when? Look for place and time words (<i>long ago, jungle, by the river</i>).',
  '<b>Problem:</b> what does the main character want or need to fix? It usually appears early.',
  '<b>Events:</b> what does the character <i>do</i> to try to fix it, in order?',
  '<b>Solution:</b> the thing that <i>actually fixes</i> the problem. Then ask: what lesson was learned?'],
 ex:`<span class="tag">Story Map: "How the Leopard Got Its Spots"</span>
 <table class="tbl">
 <tr><th>Characters</th><td>leopard, wise old turtle, the sun (also zebra, giraffe, wild dog)</td></tr>
 <tr><th>Setting</th><td>the jungle, by the river, a long time ago</td></tr>
 <tr><th>Problem</th><td>The leopard is tired of being a plain cat. He wants to be special like the other animals.</td></tr>
 <tr><th>Events</th><td>visits the turtle → goes on a journey → meets animals with designs → makes a wish → sun offers help if he is patient → he stands still in the heat</td></tr>
 <tr><th>Solution</th><td>The sun\'s heat leaves marks – spots – on his golden fur.</td></tr>
 <tr><th>Lesson</th><td>Being patient and brave can lead to something amazing.</td></tr></table>`,
 trap:'<b>Advice is not the solution.</b> The turtle <i>tells</i> the leopard to go on a journey – that is an <b>event</b>. The <b>solution</b> is when the sun actually gives him spots. Ask: "Which part really fixes the problem?"',
 extra:'<p>Picture a <b>Story Mountain</b>: start at the bottom (characters, setting, problem), climb through the events, reach the top (the big moment), then slide down to the solution at the end. 🏔️</p>',
 check:[
  {q:'"Last winter, in a snowy park, Ben built a snowman." What is the <b>setting</b>?',opts:['Ben','a snowy park last winter','the snowman'],a:1,why:'Setting = where and when.'},
  {q:'Mia\'s kite blew away. She raced up the hill and grabbed the string just in time. Which part is the <b>solution</b>?',opts:['Mia\'s kite blew away.','Mia grabbed the string and saved her kite.','It was a windy day.'],a:1,why:'The solution is what fixes the problem.'},
  {q:'The solution of a story is…',opts:['where the problem begins','how the problem gets fixed','who the characters are'],a:1,why:'Solution = how the problem is solved.'}]},

{id:'affix',skill:'affix',em:'🧩',title:'Affixes: Prefixes & Suffixes',
 big:'An <b>affix</b> is a word part added to a <b>root</b> (base word). A <b>prefix</b> goes at the <i>front</i> and changes the meaning. A <b>suffix</b> goes at the <i>end</i> and adds meaning or changes how the word is used.',
 steps:[
  '<b>Chop it.</b> Cover the prefix or suffix. What root word is left?',
  '<b>Define each part.</b> What does the root mean? What does the affix mean?',
  '<b>Put it together.</b> Say the meaning in your own words, then check it makes sense.'],
 ex:`<span class="tag">Example from the review sheet</span><br>
 <span class="pre">re-</span><span class="root">read</span> → <b>re-</b> means <b>again</b> (or back). So <b>reread</b> means <span class="hl">read again</span>.<br><br>
 <span class="root">peace</span><span class="suf">-ful</span><span class="suf">-ly</span> → peace = calm; <b>-ful</b> = full of; <b>-ly</b> = in a ___ way. So <b>peacefully</b> means <span class="hl">in a calm and gentle way</span>.`,
 trap:'Don\'t just describe the word with a feeling ("very happy"). A <b>-ly</b> word tells <i>how</i> something is done: <i>peacefully</i> = <b>in a peaceful way</b>. And <b>re-</b> means <i>again</i> – so <i>reread</i> means <b>read again</b> (not just "go back").',
 extra:`<h3>Affix cheat sheet</h3>
 <table class="tbl"><tr><th>Prefix</th><th>Meaning</th><th>Examples</th></tr>
 <tr><td class="pre">re-</td><td>again / back</td><td>reread, rewrite, replay, retell</td></tr>
 <tr><td class="pre">un-</td><td>not / opposite</td><td>unhappy, unfair, unlock</td></tr>
 <tr><td class="pre">pre-</td><td>before</td><td>preview, pretest, prepay</td></tr>
 <tr><td class="pre">dis-</td><td>not / opposite</td><td>dislike, disagree, disappear</td></tr>
 <tr><td class="pre">mis-</td><td>wrongly</td><td>misspell, misread, misplace</td></tr></table>
 <table class="tbl"><tr><th>Suffix</th><th>Meaning</th><th>Examples</th></tr>
 <tr><td class="suf">-ful</td><td>full of</td><td>careful, joyful, helpful</td></tr>
 <tr><td class="suf">-less</td><td>without</td><td>hopeless, fearless, careless</td></tr>
 <tr><td class="suf">-ly</td><td>in a ___ way</td><td>quickly, gently, bravely</td></tr>
 <tr><td class="suf">-ness</td><td>state of being</td><td>kindness, sadness, darkness</td></tr>
 <tr><td class="suf">-able</td><td>able to be</td><td>readable, breakable, washable</td></tr></table>
 <p>Spelling tip: when a word ends in <b>y</b>, change it to <b>i</b> before adding <b>-ly</b> or <b>-ness</b> (happy → <b>happ<u>i</u>ly</b>).</p>`,
 check:[
  {q:'What does <b>unfair</b> mean?',opts:['not fair','very fair','fair again'],a:0,why:'un- means not.'},
  {q:'In <b>hopeless</b>, what does the suffix <b>-less</b> mean?',opts:['full of','without','again'],a:1,why:'-less means without, so hopeless = without hope.'},
  {q:'What does <b>gently</b> mean?',opts:['in a gentle way','full of gentle','not gentle'],a:0,why:'-ly means "in a ___ way."'}]},

{id:'feelings',skill:'feelings',em:'💭',title:'Thoughts, Feelings & Actions',
 big:'Authors rarely say "she felt scared." They <b>show</b> you! Look at what a character <b>says</b>, <b>does</b>, and <b>thinks</b> – those clues tell you how the character <b>feels</b> and what the character is like.',
 steps:[
  '<b>Find the problem.</b> What is the character facing?',
  '<b>Collect the clues.</b> What does the character say? do? think?',
  '<b>Name the feeling or trait.</b> Use a precise word: <i>proud, embarrassed, determined</i> – not just "good" or "bad."',
  '<b>Check the response.</b> What did the character DO about the problem? That shows how they respond.'],
 ex:`<span class="tag">Example from the leopard story</span><br>
 <b>Action:</b> <i>"Instead of running away, he stood still."</i> → he is <span class="hl">patient and brave</span>.<br>
 <b>Thought:</b> <i>"Now I am special, just like I wished."</i> + <b>Words:</b> <i>"he was proud of them"</i> → at the end he feels <span class="hl">proud</span>.`,
 trap:'<b>Check the whole text!</b> One answer choice said the leopard felt <i>mad that the sun burned him</i>. But the story says he <b>allowed</b> the sun\'s rays to touch his fur and he was <b>amazed</b> and <b>proud</b>. Wrong choices often grab one small detail.',
 extra:`<h3>Feeling words (use these in your writing!)</h3>
 <table class="tbl">
 <tr><td>😀 Happy</td><td>proud, delighted, joyful, amazed, cheerful</td></tr>
 <tr><td>😢 Sad</td><td>disappointed, lonely, embarrassed, discouraged</td></tr>
 <tr><td>😠 Mad</td><td>angry, frustrated, annoyed</td></tr>
 <tr><td>😨 Scared</td><td>nervous, worried, timid</td></tr>
 <tr><td>💪 Traits (lasting)</td><td>brave, patient, curious, determined, kind, clever</td></tr></table>
 <p><b>Feeling</b> = changes during the story. <b>Trait</b> = what the character is like most of the time.</p>`,
 check:[
  {q:'Dana\'s hands shook. She hid behind her mom when the big dog barked. How did Dana feel?',opts:['scared','proud','bored'],a:0,why:'Shaking and hiding are scared clues.'},
  {q:'Leo stomped his feet and slammed the door. How did Leo feel?',opts:['calm','frustrated and angry','sleepy'],a:1,why:'Stomping and slamming show anger.'},
  {q:'Ana practiced piano daily even when her fingers hurt. Which trait fits?',opts:['lazy','determined','shy'],a:1,why:'She keeps trying – that is determined.'}]},

{id:'evidence',skill:'evidence',em:'📍',title:'Proof Finder: Text Evidence',
 big:'Many test questions come in <b>two parts</b>: Part A asks a question; Part B asks <b>"Which line proves it?"</b> The best proof is the line that <i>directly shows</i> your answer – not a line that merely mentions the same topic.',
 steps:[
  '<b>Answer Part A first</b> using what you know from the text.',
  '<b>Go back and find it.</b> Put your finger on the exact lines.',
  '<b>Test each line:</b> If I read just this line, would it prove my answer? Pick the strongest.',
  '<b>Say it:</b> "The text says…" and copy the words.'],
 ex:`<span class="tag">Example from "The Chameleon"</span><br>
 <b>Part A:</b> Why does the poet say "we never know what skin you\'re in"? → Chameleons change colors.<br>
 <b>Part B:</b> Which line proves it? <span class="hl">"Sometimes you\'re yellow, / Then you\'re green."</span><br>
 Not <i>"Chameleon, comedian"</i> (that\'s a name) and not <i>"Chameleon you\'re hard to find"</i> (that\'s about hiding). Only the yellow-to-green line <b>shows the change</b>.`,
 trap:'A line can be <b>true</b> and still be <b>wrong proof</b>. Ask "Does this line show my answer, or just sit near it?"',
 extra:`<h3>Write a strong answer with A.C.E.</h3>
 <ul><li><b>A – Answer</b> the question in a full sentence. Use words from the question.</li>
 <li><b>C – Cite</b> proof: <i>The text says, "…".</i></li>
 <li><b>E – Explain</b> how the proof shows your answer: <i>This shows that…</i></li></ul>
 <div class="example"><span class="tag">Model answer – "What is the problem in the story?"</span><br>
 <b>A:</b> The problem in the story is that the leopard is tired of being a plain cat and wants to be special.
 <b>C:</b> The text says, "He wanted to be special like the other jungle animals."
 <b>E:</b> This shows he wants spots or markings like the other animals have.</div>`,
 check:[
  {q:'Claim: <i>The fox is clever.</i> Which detail best proves it?',opts:['The fox lived in the woods.','The fox tricked the crow into dropping the cheese.','The fox was orange.'],a:1,why:'Tricking the crow shows cleverness.'},
  {q:'In a two-part question, Part B should…',opts:['prove your Part A answer','change your answer','talk about something different'],a:0,why:'Part B asks for the line that proves Part A.'},
  {q:'Which line from "The Chameleon" proves chameleons change color?',opts:['Chameleon, comedian','Sometimes you\'re yellow, / Then you\'re green.','Comedian, make up your mind!'],a:1,why:'Yellow then green shows a change.'}]},

{id:'playbook',skill:null,em:'🛡️',title:'Test-Day Playbook',
 big:'Smart test-takers have a routine. Use these seven steps on every passage and you will stay calm and accurate.',
 steps:[
  '<b>Read the passage twice.</b> First for the story. Second to notice details. Underline names, problems, and feeling clues.',
  '<b>Read each question slowly.</b> Circle the key word: <i>problem, solution, purpose, feel, mean, line</i>.',
  '<b>Predict.</b> Try to answer in your head <i>before</i> looking at the choices.',
  '<b>Cross out</b> choices that are clearly wrong. Look out for the traps below.',
  '<b>Two-part questions:</b> make sure Part B truly proves Part A.',
  '<b>Written answers:</b> use A.C.E. and finish with a period and capital letters.',
  '<b>Check.</b> Reread the question. Does your answer match what is asked? Take a deep breath – you\'ve got this.'],
 ex:`<span class="tag">Common wrong-answer traps</span><br>
 🪤 <b>True but not the answer</b> – it happened in the story, but doesn\'t answer <i>this</i> question.<br>
 🪤 <b>Too small</b> – only one detail instead of the main idea.<br>
 🪤 <b>Opposite</b> – says the reverse of the text.<br>
 🪤 <b>Real-life memory</b> – true in real life but not what this text says.`,
 trap:'',extra:'',check:[]}
];

purpose:{title:'Purpose Sorter',skill:'purpose',em:'🎯',desc:'Why did the author write it?',items:(function(){
 const O=['Entertain','Inform','Persuade','Explain why (pourquoi)','Teach how-to'];
 const m=(t,a,w)=>({q:'<i>'+t+'</i><br>What is the author\'s purpose?',opts:O,a:a,why:w});
 return [
 m('Once there was a bear who was afraid of honeybees. Every time one buzzed by, he dove into a bush!',0,'A fun story with a character – entertain.'),
 m('Penguins live in the Southern Hemisphere. They eat fish and krill.',1,'Facts – inform.'),
 m('You should read for twenty minutes every night. It is the best way to become a great reader!',2,'"Should" and "best" are persuasion words.'),
 m('Long ago, the moon was close enough to touch. A boy reached for it, and the moon floated up, up, up. That is why the moon is so high today.',3,'A made-up story explaining why – pourquoi.'),
 m('To make a paper airplane, first fold the paper in half lengthwise. Next, fold the top corners to the middle.',4,'Steps with first and next – a how-to.'),
 m('Pitter-patter, drip-drop rain, dancing on my windowpane.',0,'A playful poem – entertain.'),
 m('Every kid needs a bike helmet. Wear one on every ride – it could save your life!',2,'It tries to convince you – persuade.'),
 m('A caterpillar changes into a butterfly in four stages: egg, larva, pupa, and adult.',1,'Facts about nature – inform.'),
 m('Long ago, Bat refused to help build the forest. As a result, the trees held him upside down. That is why bats hang from branches.',3,'Explains why bats hang upside down – pourquoi.'),
 m('Step 1: Fill a cup with soil. Step 2: Push a bean seed into the soil. Step 3: Add a little water.',4,'Numbered steps – how-to.'),

function mcWidget(item,cb,o){
  o=o||{}; const w=h('div','qwrap'); w.appendChild(h('div','qtext',item.q));
  const box=h('div','opts'); const fb=h('div','fb'); fb.hidden=true; let done=false;
  const order=o.shuffle?shuffle(item.opts.map((_,i)=>i)):item.opts.map((_,i)=>i);

    b.onclick=()=>{ if(done)return; done=true; const ok=oi===item.a;

function evalWrite(q,text){
  const t=text.toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  const res=q.keys.map(g=>g[0].some(k=>t.indexOf(k)>=0)); const hits=res.filter(Boolean).length;
  return {res,hits,total:q.keys.length};
}
function writeWidget(q,cb){
  const w=h('div','qwrap'); w.appendChild(h('div','qtext',q.q));
  w.insertAdjacentHTML('beforeend','<textarea class="wr" placeholder="Write a full sentence. Remember A.C.E.: Answer, Cite, Explain." aria-label="Your answer"></textarea>');
  const ta=$('textarea',w); const btn=h('button','btn green','✅ Check my answer'); btn.type='button';
  const out=h('div'); w.appendChild(btn); w.appendChild(out); let done=false;
  btn.onclick=()=>{
    if(done)return; if(ta.value.trim().length<4){toast('Write your answer first ✏️');return;}
    done=true; ta.disabled=true; btn.hidden=true; const r=evalWrite(q,ta.value);

    out.innerHTML='<div class="chips">'+chips+'</div><div class="fb '+(r.hits===r.total?'good':'info')+'">'+(r.hits===r.total?'🌟 Strong answer! You hit every part.':'📝 Compare with the model below, then fix any ✗ part in your own words. (This checker looks for key ideas – always compare with the model too.)')+'</div><div class="model"><b>Model answer:</b><br>'+q.model+'</div>';
    if(cb)cb(r);
  };
  return w;
}

function affixItems(){

  words.forEach((w,i)=>{
    const parts=w.aff.charAt(0)==='-'?'<span class="root">'+w.root+'</span><span class="suf">'+w.aff+'</span>':'<span class="pre">'+w.aff+'</span><span class="root">'+w.root+'</span>';
    if(i%3===2){ const cor=AFFIX_MEANINGS[w.aff]; const wr=shuffle(meaningsAll.filter(m=>m!==cor)).slice(0,2);
      out.push(makeMC('What does <b>'+w.aff+'</b> mean in the word <b>'+w.w+'</b>?',cor,wr,parts+' → '+w.aff+' means <b>'+cor+'</b>.')); }

function orderGame(host){

function memoryGame(host){
  const pairs=[['re-','again / back'],['un-','not / opposite'],['pre-','before'],['mis-','wrongly'],['-ful','full of'],['-less','without'],['-ly','in a ___ way'],['-ness','state of being']];
  let deck=[]; pairs.forEach((p,i)=>{deck.push({k:i,t:p[0]});deck.push({k:i,t:p[1]});}); deck=shuffle(deck);
  let open=[],lock=false,found=0,tries=0;
  host.innerHTML='<h3>🧠 Affix Memory</h3><p>Flip two cards. Match each <b>affix</b> with its <b>meaning</b>!</p><div class="scorebar" id="memS"></div><div class="mem-grid" id="memG"></div><div class="center" style="margin-top:12px"><button class="btn purple" id="memR">🔄 New game</button></div>';
  const stat=()=>{$('#memS').innerHTML='<span>Tries: '+tries+'</span><span>Pairs: '+found+' / '+pairs.length+'</span>';}; stat();
  deck.forEach((c,idx)=>{ const d=h('div','mem','?'); d.tabIndex=0;
    const flip=()=>{ if(lock||d.classList.contains('up')||d.classList.contains('ok'))return; d.classList.add('up'); d.textContent=c.t; open.push({d:d,c:c});
      if(open.length===2){ lock=true; tries++; const a=open[0],b=open[1];
        setTimeout(()=>{ if(a.c.k===b.c.k){ a.d.classList.add('ok');b.d.classList.add('ok');found++; record('affix',true); if(found===pairs.length){ earn('memory',3); toast('All pairs found! 🎉'); } }
          else { a.d.classList.remove('up');b.d.classList.remove('up');a.d.textContent='?';b.d.textContent='?'; record('affix',false);} open=[];lock=false;stat(); },750); } };
    d.onclick=flip; d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}}; $('#memG').appendChild(d); });
  $('#memR').onclick=()=>memoryGame(host);
}

  <div class="panel"><h2>Coaching tips that work</h2>
  <p><b>Ask “How do you know?”</b> after every answer. Have her point to the exact words. This is the habit that separates high scorers.</p>
  <p><b>Read passages twice</b>, once for the story and once for details. Use 🔊 Read aloud if she is tired, but have her read aloud to you too.</p>
  <p><b>Celebrate mistakes</b> as clues: “Which trap did that answer set?” (true-but-wrong, too small, opposite, real-life memory).</p>
  <p><b>Mastery target:</b> every Skill Meter at 90% or higher on two different days, and 90% or higher on both practice tests.</p>
